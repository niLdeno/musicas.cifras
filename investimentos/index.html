<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Minha Carteira — acompanhamento de investimentos</title>
  <meta name="description" content="Acompanhe suas ações, FIIs, ETFs e BDRs: preço médio, lucro e prejuízo, proventos e imposto de renda — de forma simples e didática." />
  <meta name="theme-color" content="#f6f6f3" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#111110" media="(prefers-color-scheme: dark)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Carteira" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="icons/icone.svg" />
  <link rel="apple-touch-icon" href="icons/icone.svg" />
  <!-- Content Security Policy: só carrega scripts do próprio site e da CDN do Chart.js;
       só conversa com a API de cotações. Reduz muito o risco de XSS. -->
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://brapi.dev; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" />
  <link rel="stylesheet" href="css/styles.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js" defer></script>
  <script type="module" src="js/app.js"></script>
</head>

<body>
  <a class="pular" href="#conteudo">Pular para o conteúdo</a>

  <aside class="lateral" aria-label="Menu principal">
    <div class="marca">
      <img src="icons/icone.svg" alt="" width="32" height="32" />
      <div><strong>Minha Carteira</strong><small>Renda variável · B3</small></div>
    </div>
    <nav id="menu" class="menu"></nav>
    <p class="lateral-rodape">Seus dados ficam só neste navegador. Faça backup em Configurações.</p>
  </aside>

  <div class="principal">
    <header class="topo">
      <div class="topo-titulo">
        <h1 id="titulo-pagina">Painel</h1>
        <span id="status-cotacao" class="status-cotacao"></span>
      </div>
      <div class="topo-acoes">
        <button type="button" class="btn-icone" id="btn-atualizar" title="Atualizar cotações" aria-label="Atualizar cotações">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7" /></svg>
        </button>
        <button type="button" class="btn-icone" id="btn-ocultar" title="Ocultar valores" aria-label="Ocultar valores" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z" /><circle cx="12" cy="12" r="3" /></svg>
        </button>
        <button type="button" class="btn-icone" id="btn-tema" title="Alternar tema claro/escuro" aria-label="Alternar tema">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 13A9 9 0 1 1 11 3a7 7 0 0 0 10 10Z" /></svg>
        </button>
        <button type="button" class="btn primario" id="btn-novo">
          <span aria-hidden="true">＋</span> <span class="rotulo-longo">Nova operação</span>
        </button>
      </div>
    </header>

    <div id="faixa-demo" class="faixa-demo" hidden></div>
    <main id="conteudo" class="conteudo" tabindex="-1"></main>
  </div>

  <nav id="abas" class="abas" aria-label="Navegação"></nav>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <noscript>Este aplicativo precisa de JavaScript ativado.</noscript>
</body>

</html>
